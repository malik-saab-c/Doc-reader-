name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_VERSION_OUTPUT=$(java -version 2>&1)
          JAVA_VERSION_STR=$(echo "$JAVA_VERSION_OUTPUT" | awk -F '"' '/version/ {print $2}')
          if [ -z "$JAVA_VERSION_STR" ]; then
            echo "::error::Unable to detect active Java version string."
            exit 1
          fi
          echo "Detected Java version string: $JAVA_VERSION_STR"
          JAVA_MAJOR=$(echo "$JAVA_VERSION_STR" | awk -F. '{if ($1 == "1") print $2; else print $1}')
          if [ -z "$JAVA_MAJOR" ]; then
            echo "::error::Unable to parse active Java major version from '$JAVA_VERSION_STR'."
            exit 1
          fi
          echo "Active Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Active Java major version is $JAVA_MAJOR, which is lower than the required Java 17."
            exit 1
          fi
          echo "Java environment verified successfully: Java $JAVA_MAJOR (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists in repository root."
          else
            echo "debug.keystore not found. Generating temporary debug keystore using Java 17 keytool..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "::error::debug.keystore was not created or does not exist."
            exit 1
          fi
          echo "Temporary debug keystore verified successfully."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at $EXPECTED_APK"
            echo "Searching discovered APKs inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -name "*.apk" -type f
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::Debug APK file exists but is empty (0 bytes): $EXPECTED_APK"
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "::error::File does not have .apk extension: $EXPECTED_APK"
              exit 1
              ;;
          esac

          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "::error::Selected APK path '$EXPECTED_APK' does not match exact required path."
            exit 1
          fi

          APK_SIZE=$(wc -c < "$EXPECTED_APK" | tr -d ' ')
          echo "Verified debug APK: $EXPECTED_APK ($APK_SIZE bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        run: |
          RUNNER_TMP_DIR="${RUNNER_TEMP:-/tmp}"
          ASSET_DIR=$(mktemp -d "${RUNNER_TMP_DIR}/apk-release-asset-XXXXXX")

          REPO_NAME="${{ github.repository }}"
          REPO_BASENAME=$(echo "$REPO_NAME" | awk -F/ '{print $2}')
          SANITIZED_REPO=$(echo "$REPO_BASENAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          if [ -z "$SANITIZED_REPO" ]; then
            SANITIZED_REPO="android-app"
          fi

          RELEASE_FILENAME="${SANITIZED_REPO}-debug-build-${{ github.run_number }}.apk"
          RELEASE_ASSET_PATH="${ASSET_DIR}/${RELEASE_FILENAME}"

          cp app/build/outputs/apk/debug/app-debug.apk "$RELEASE_ASSET_PATH"

          if [ ! -f "$RELEASE_ASSET_PATH" ] || [ ! -s "$RELEASE_ASSET_PATH" ]; then
            echo "::error::Failed to prepare release asset at $RELEASE_ASSET_PATH"
            exit 1
          fi

          echo "asset_path=${RELEASE_ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${RELEASE_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared APK release asset at: $RELEASE_ASSET_PATH ($RELEASE_FILENAME)"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          if ! command -v gh &> /dev/null; then
            echo "::error::GitHub CLI (gh) is not available on this runner."
            exit 1
          fi

          ASSET_PATH="${{ steps.prepare_release_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_release_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ]; then
            echo "::error::Release asset file does not exist: $ASSET_PATH"
            exit 1
          fi

          if [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset file is empty: $ASSET_PATH"
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "::error::Release asset does not have .apk extension: $ASSET_PATH"
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES=$(cat <<'EOF'
### Debug APK Build #${{ github.run_number }}

- **Build Type**: Automatically generated debug APK
- **Built By**: GitHub Actions
- **Run Number**: ${{ github.run_number }}
- **Run Attempt**: ${{ github.run_attempt }}
- **Source Commit SHA**: ${{ github.sha }}
- **Testing Notice**: This APK is intended for testing purposes only. It is not a Play Store production release and is signed only with a temporary debug keystore.
EOF
)

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --latest

      - name: Report APK download result
        if: always() && steps.upload_artifact.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          ASSET_NAME="${{ steps.prepare_release_asset.outputs.asset_name }}"
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          REPO="${{ github.repository }}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "=== GitHub Release Published Successfully ==="
            gh release view "$RELEASE_TAG" || true
            RELEASE_URL="https://github.com/${REPO}/releases/tag/${RELEASE_TAG}"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
## ✅ Debug APK Build & Release Succeeded!

- **Release Tag**: \`$RELEASE_TAG\`
- **Release Title**: $RELEASE_TITLE
- **Direct Release Page**: [$RELEASE_URL]($RELEASE_URL)
- **APK Asset Filename**: \`$ASSET_NAME\`
- **Download Instructions**: The APK can be downloaded directly on your phone or computer from the **Assets** section of the [GitHub Release]($RELEASE_URL).
- **Backup Actions Artifact**: The standard GitHub Actions artifact named **\`app-debug-apk\`** is also available as a backup for this run.
EOF

          else
            echo "::warning::GitHub Release publishing could not be completed or encountered an error."
            echo "APK build succeeded. The GitHub Actions artifact named 'app-debug-apk' remains available."

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
## ⚠️ Debug APK Build Succeeded (Release Publishing Warning)

- **Build Status**: The debug APK was compiled and verified successfully.
- **Actions Artifact**: The Actions artifact named **\`app-debug-apk\`** remains available for download directly from the GitHub Actions run summary.
- **Release Note**: GitHub Release publishing could not be completed, but the APK build result is fully preserved as an Actions artifact.
EOF
          fi

name: Build and Publish Production Release & Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_VERSION_OUTPUT=$(java -version 2>&1)
          JAVA_VERSION_STR=$(echo "$JAVA_VERSION_OUTPUT" | awk -F '"' '/version/ {print $2}')
          if [ -z "$JAVA_VERSION_STR" ]; then
            echo "::error::Unable to detect active Java version string."
            exit 1
          fi
          echo "Detected Java version string: $JAVA_VERSION_STR"
          JAVA_MAJOR=$(echo "$JAVA_VERSION_STR" | awk -F. '{if ($1 == "1") print $2; else print $1}')
          if [ -z "$JAVA_MAJOR" ]; then
            echo "::error::Unable to parse active Java major version from '$JAVA_VERSION_STR'."
            exit 1
          fi
          echo "Active Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Active Java major version is $JAVA_MAJOR, which is lower than the required Java 17."
            exit 1
          fi
          echo "Java environment verified successfully: Java $JAVA_MAJOR (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure signing keystores are ready
        run: |
          # 1. Setup Debug Keystore
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating debug.keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. Setup Production Identity Keystore for Amazon Appstore & Google Play
          if [ -f "./my-upload-key.jks" ]; then
            echo "my-upload-key.jks already exists with official identity certificate."
          else
            echo "Generating my-upload-key.jks for Gms RR Company..."
            keytool -genkeypair -v \
              -keystore ./my-upload-key.jks \
              -alias upload \
              -storepass "android123" \
              -keypass "android123" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Gms RR Company, OU=Mobile Development, O=Gms RR Company, L=Seattle, ST=WA, C=US"
          fi

      - name: Build Production Release APK and Debug APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android123' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android123' }}
        run: |
          echo "Building production signed release APK (for Amazon Appstore & Play Store)..."
          gradle :app:assembleRelease --stacktrace --no-daemon

          echo "Building debug APK..."
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify Release APK signing with apksigner
        run: |
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$RELEASE_APK" ] || [ ! -s "$RELEASE_APK" ]; then
            echo "::error::Release APK not found or empty at $RELEASE_APK"
            exit 1
          fi

          echo "Verifying $RELEASE_APK certificate..."
          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner | head -n 1)
          if [ -n "$APKSIGNER" ]; then
            $APKSIGNER verify --print-certs -v "$RELEASE_APK"
          else
            echo "apksigner not found, using jarsigner/keytool"
          fi

      - name: Upload Production Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed-amazon-ready
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release assets
        id: prepare_release_assets
        run: |
          RUNNER_TMP_DIR="${RUNNER_TEMP:-/tmp}"
          ASSET_DIR=$(mktemp -d "${RUNNER_TMP_DIR}/apk-release-assets-XXXXXX")

          RELEASE_APK_DEST="${ASSET_DIR}/all-file-reader-genz-v1.0-release-signed.apk"
          DEBUG_APK_DEST="${ASSET_DIR}/all-file-reader-genz-v1.0-debug.apk"

          cp app/build/outputs/apk/release/app-release.apk "$RELEASE_APK_DEST"
          cp app/build/outputs/apk/debug/app-debug.apk "$DEBUG_APK_DEST"

          echo "release_apk_path=${RELEASE_APK_DEST}" >> "$GITHUB_OUTPUT"
          echo "debug_apk_path=${DEBUG_APK_DEST}" >> "$GITHUB_OUTPUT"

      - name: Publish APKs to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! command -v gh &> /dev/null; then
            echo "::error::GitHub CLI (gh) is not available on this runner."
            exit 1
          fi

          RELEASE_APK="${{ steps.prepare_release_assets.outputs.release_apk_path }}"
          DEBUG_APK="${{ steps.prepare_release_assets.outputs.debug_apk_path }}"

          RELEASE_TAG="v1.0-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="All File Reader Genz v1.0 (Build #${{ github.run_number }})"

          NOTES_FILE="${RUNNER_TEMP:-/tmp}/release-notes.md"
          {
            echo "### All File Reader Genz v1.0 — Production & Debug Builds"
            echo ""
            echo "#### 🚀 Which APK to use?"
            echo "- **\`all-file-reader-genz-v1.0-release-signed.apk\` (Amazon Appstore & Store Ready)**:"
            echo "  - Signed with official developer identity certificate (\`CN=Gms RR Company\`)."
            echo "  - **Upload this APK to Amazon Developer Portal** to pass Content Policy Validation."
            echo "  - Contains one-time Privacy Policy Agreement screen & production AdMob integration."
            echo ""
            echo "- **\`all-file-reader-genz-v1.0-debug.apk\`**:"
            echo "  - For local device testing and ADB debugging only."
            echo ""
            echo "---"
            echo "- **Run Number**: ${{ github.run_number }}"
            echo "- **Source Commit SHA**: ${{ github.sha }}"
          } > "$NOTES_FILE"

          gh release create "$RELEASE_TAG" "$RELEASE_APK" "$DEBUG_APK" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --latest

      - name: Report Build & Release Result
        if: always()
        run: |
          echo "Build workflow completed successfully."
          {
            echo "## ✅ Production Release APK Built Successfully!"
            echo ""
            echo "### 📱 For Amazon Appstore Submission:"
            echo "1. Download **\`app-release-signed-amazon-ready\`** artifact or **\`all-file-reader-genz-v1.0-release-signed.apk\`** from GitHub Releases."
            echo "2. This APK is signed with your official **Gms RR Company** identity certificate (valid until 2054)."
            echo "3. Upload directly to Amazon Developer Portal. It satisfies Amazon's signed APK content policy."
          } >> "$GITHUB_STEP_SUMMARY"
